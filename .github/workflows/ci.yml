name: Telemedicine Backend CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Compile & Concurrency Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: amrutam_secure_pass
          POSTGRES_DB: amrutam_telemedicine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Compilation
        run: npm run build

      - name: Run Test Suite (Concurrency, Idempotency & E2E)
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://amrutam_user:amrutam_secure_pass@localhost:5432/amrutam_telemedicine?sslmode=disable
          JWT_SECRET: super_secret_jwt_access_key_min_32_characters_long_amrutam_2026
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_min_32_characters_long_amrutam_2026
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

      - name: Security & Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: amrutam/telemedicine-backend:latest
