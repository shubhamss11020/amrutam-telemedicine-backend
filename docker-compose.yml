version: '3.8'

services:
  # 1. PostgreSQL 16 Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: amrutam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amrutam_user
      POSTGRES_PASSWORD: amrutam_secure_pass
      POSTGRES_DB: amrutam_telemedicine
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/core/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amrutam_user -d amrutam_telemedicine']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amrutam_network

  # 2. Redis 7 Cache & Rate Limiting Engine
  redis:
    image: redis:7-alpine
    container_name: amrutam_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - amrutam_network

  # 3. Telemedicine Backend Service (Node.js 22 LTS)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: amrutam_backend_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://amrutam_user:amrutam_secure_pass@postgres:5432/amrutam_telemedicine?sslmode=disable
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: amrutam_user
      DB_PASSWORD: amrutam_secure_pass
      DB_NAME: amrutam_telemedicine
      DB_POOL_MAX: 20
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: 'true'
      JWT_SECRET: super_secret_jwt_access_key_min_32_characters_long_amrutam_2026
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_min_32_characters_long_amrutam_2026
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      LOG_LEVEL: info
      PROMETHEUS_METRICS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amrutam_network

  # 4. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: amrutam_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - app
    networks:
      - amrutam_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  amrutam_network:
    driver: bridge
